<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sick Image Editor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            color: #252525;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            image-rendering: pixelated;
            background: #7b8a59;
            background-image:
                linear-gradient(135deg, rgba(255, 255, 255, .1) 25%, transparent 25%),
                linear-gradient(315deg, rgba(0, 0, 0, .13) 25%, transparent 25%),
                linear-gradient(45deg, rgba(0, 0, 0, .08) 25%, transparent 25%),
                linear-gradient(225deg, rgba(255, 255, 255, .08) 25%, transparent 25%);
            background-size: 42px 42px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: rgba(34, 45, 29, .28);
            backdrop-filter: blur(2px);
        }

        .screen {
            position: relative;
            width: min(1050px, calc(100% - 28px));
            margin: 30px auto;
            padding: 18px;
            background: #c6c6c6;
            border: 4px solid;
            border-color: #ffffff #555 #555 #ffffff;
            box-shadow: 0 10px 0 rgba(0, 0, 0, .22), inset 2px 2px 0 #eeeeee, inset -2px -2px 0 #777;
        }

        .titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin: 1px 0 18px;
            color: #343434;
            text-shadow: 2px 2px #eeeeee;
        }

        h1 {
            font-size: clamp(12px, 2vw, 18px);
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 190px minmax(180px, 1fr);
            align-items: center;
            gap: 28px;
            padding: 18px;
            background: #bdbdbd;
            border: 3px solid;
            border-color: #555 #fff #fff #555;
            box-shadow: inset 2px 2px #777, inset -2px -2px #dedede;
        }

        .label {
            display: block;
            margin-bottom: 10px;
            font-size: 10px;
            text-shadow: 1px 1px #eee;
        }

        .preview {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            min-height: 180px;
            background-color: #8d8d8d;
            background-image: linear-gradient(45deg, #979797 25%, transparent 25%), linear-gradient(-45deg, #979797 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #979797 75%), linear-gradient(-45deg, transparent 75%, #979797 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            border: 5px solid;
            border-color: #383838 #f5f5f5 #f5f5f5 #383838;
            box-shadow: inset 3px 3px #555, inset -3px -3px #aaa;
            overflow: hidden;
        }

        .preview-control {
            position: absolute;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            padding: 0;
            color: #252525;
            font: 14px/1 'Courier New', monospace;
            background: #c6c6c6;
            border: 3px solid;
            border-color: #fff #555 #555 #fff;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, .3);
            cursor: pointer;
        }

        .expand-icon {
            display: block;
            width: 14px;
            height: 14px;
            background:
                linear-gradient(#252525, #252525) left top / 6px 2px no-repeat,
                linear-gradient(#252525, #252525) left top/ 2px 6px no-repeat,
                linear-gradient(#252525, #252525) right top / 6px 2px no-repeat,
                linear-gradient(#252525, #252525) right top / 2px 6px no-repeat,
                linear-gradient(#252525, #252525) left bottom / 6px 2px no-repeat,
                linear-gradient(#252525, #252525) left bottom / 2px 6px no-repeat,
                linear-gradient(#252525, #252525) right bottom / 6px 2px no-repeat,
                linear-gradient(#252525, #252525) right bottom / 2px 6px no-repeat;
        }

        .preview-control:hover{
            background: #e0e0e0;
        }

        .preview-control:active{
            border-color: #555 #fff #fff #555;
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .enlarge-control{
            right: 8px;
            bottom: 8px;
        }

        .save-control{
            top: 8px;
            right: 8px;
            width: auto;
            padding: 0 8px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 7px;
        }

        .processing-status{
            position: absolute;
            z-index: 1;
            right: 0;
            bottom: 10px;
            left: 0;
            display: none;
            color: #252525;
            font-size: 8px;
            text-align: center;
            text-shadow: 1px 1px #bdbdbd;
        }

        .output-preview.processing .processing-status {
            display: block;
        }

        .preview-hint {
            position: absolute;
            bottom: 12px;
            font-size: 7px;
            color: #494949;
        }

        .output-preview {
            background-color: #75806e;
            filter: saturate(.7);
        }

        .output-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .source-preview {
            cursor: pointer;
        }

        .source-preview.has-image {
            background: #777;
        }

        .source-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .source-preview.drag-over {
            background-color: #9a9a68;
        }

        .filter-zone {
            text-align: center;
        }

        .zone-title {
            display: block;
            margin-bottom: 12px;
            font-size: 9px;
            text-shadow: 1px 1px #eee;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, 68px);
            gap: 8px;
            justify-content: center;
            margin: 0 auto;
        }

        .slot {
            position: relative;
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            padding: 4px;
            background: #8b8b8b;
            border: 4px solid;
            border-color: #373737 #e8e8e8 #e8e8e8 #373737;
            box-shadow: inset 2px 2px #5d5d5d, inset -2px -2px #bdbdbd;
        }

        .slot.drag-over {
            background: #b9a85b;
            box-shadow: inset 2px 2px #66591f, inset -2px -2px #ffffc0;
        }

        .slot:focus-visible,
        .item:focus-visible {
            outline: 3px solid #f5d25c;
            outline-offset: 3px;
        }

        .slot .item {
            width: 50px;
            height: 50px;
            cursor: grab;
        }

        .slot:empty::after {
            content: '';
            width: 28px;
            height: 28px;
            border: 2px dashed #686868;
            opacity: .45;
        }

        .arrow {
            display: block;
            margin-top: 18px;
            color: #6d6d6d;
            font-size: 42px;
            line-height: 1;
            text-shadow: 2px 2px #eee, -2px -2px #555;
        }

        .filter-note {
            margin-top: 14px;
            font-size: 7px;
            line-height: 1.8;
            color: #555;
        }

        .inventory {
            margin-top: 18px;
            padding: 16px 14px 14px;
            background: #c6c6c6;
            border: 4px solid;
            border-color: #fff #555 #555 #fff;
            box-shadow: inset 2px 2px #eee, inset -2px -2px #777;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .inventory-title {
            font-size: 10px;
            text-shadow: 1px 1px #eee;
        }

        .inventory-count {
            font-size: 7px;
            color: #555;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            padding-bottom: 28px;
        }

        .inventory-grid> :nth-child(n+28) {
            transform: translateY(28px);
        }

        .item {
            position: relative;
            display: grid;
            place-items: center;
            min-width: 0;
            aspect-ratio: 1;
            border: 3px solid;
            border-color: #373737 #ededed #ededed #373737;
            background: #8b8b8b;
            box-shadow: inset 2px 2px #555, inset -2px -2px #bdbdbd;
            cursor: grab;
            user-select: none;
            font-size: clamp(11px, 3vw, 9px);
            line-height: 1;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .item:active {
            cursor: grabbing;
        }

        .item.dragging {
            opacity: .4;
        }

        .item:nth-child(3n) {
            background: #898989;
        }

        .item:nth-child(4n) {
            background: #818181;
        }

        .filter-glyph {
            filter: drop-shadow(2px 2px #333);
        }

        .empty-row {
            opacity: .4;
        }

        .slidercss {
            position: fixed;
            z-index: 4;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            width: 66px;
            padding: 10px 8px;
            background: #c6c6c6;
            border: 3px solid;
            border-color: #fff #444 #444 #fff;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, .35);
        }

        .slidercss.visible {
            display: flex;
        }

        .slidercss label {
            font-size: 7px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        input[type=range] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 24px;
            height: 110px;
            accent-color: #586b3c;
            cursor: ns-resize;
        }

        .intensityval {
            font-size: 7px;
        }

        @media (max-width: 720px) {
            .screen {
                margin: 12px auto;
                padding: 10px;
            }

            .workspace {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 12px;
            }

            .preview {
                min-height: 160px;
                max-width: 330px;
                margin: 0 auto;
            }

            .filter-zone {
                order: 3;
            }

            .arrow {
                transform: rotate(90deg);
                margin: 4px 0;
            }

            .inventory-grid {
                gap: 4px;
            }

            .inventory-grid {
                padding-bottom: 20px;
            }

            .inventory-grid> :nth-child(n+28) {
                transform: translateY(20px);
            }

            .inventory {
                padding: 12px 8px 10px;
            }

            .item {
                border-width: 2px;
            }
        }

        .lightbox {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            background: rgba(27, 32, 23, .88);
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox img {
            max-width: min(95vw, 1200px);
            max-height: 88vh;
            object-fit: contain;
            border: 5px;
            border-color: #fff #555 #555 #fff;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, .35);
        }

        .lightbox-close {
            position: absolute;
            top: 18px;
            right: 18px;
        }
    </style>
</head>

<body>
    <main class="screen">
        <header class="titlebar">
            <h1>Sick Image Editor!!</h1>
        </header>

        <section class="workspace" aria-label="Image filter workspace">
            <input id="imageInput" type="file" accept="image/*" hidden>
            <div class="preview source-preview" id="inputpre" aria-label="Drag the image or click to load an image"
                tabindex="0" role="button">
                <span class="preview-hint">DRAG OR CLICK TO LOAD AN IMG</span>
            </div>

            <div class="filter-zone">
                <div class="filter-grid" id="filterGrid" aria-label="Drop filters here">
                    <div class="slot" tabindex="0" aria-label="Filter slot 1"></div>
                    <div class="slot" tabindex="0" aria-label="Filter slot 2"></div>
                    <div class="slot" tabindex="0" aria-label="Filter slot 3"></div>
                    <div class="slot" tabindex="0" aria-label="Filter slot 4"></div>
                </div>
                <span class="arrow" aria-hidden="true">➜</span>
            </div>

            <div class="preview output-preview" aria-label="Final output image preview">
                <button class="preview-control save-control" id="saveButton" type="button" disabled
                    aria-label="Save output" title="Save">SAVE</button>
                <span class="processing-status" id="processingStatus">hol\' up...</span>
                <button class="preview-control enlarge-control" type="button" data-enlarge="outputPreview"
                    aria-label="Enlarge" title="Enlarge"><span class="expand-icon" aria-hidden="true"></span></button>
            </div>
        </section>

        <section class="inventory" aria-label="Filter inventory">
            <div class="inventory-grid" id="inventoryGrid">
                <div class="item" draggable="true" tabindex="0" data-filter="Typography" title="renders">Typography
                </div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
                <div class="item empty-row" aria-hidden="true">·</div>
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged image">
        <button class="preview-control lightbox-close" id="lightboxClose" type="button"
            aria-label="Closed enlarged image" title="Close">✕</button>
        <img id="lightboxImage" alt="Enlarged image">
    </div>

    <aside class="slidercss" id="slider" aria-label="Filter intensity">
        <label for="intensity">INTENSITY</label>
        <input id="intensity" type="range" min="0" max="100" value="75">
        <span class="intensityval" id="intensityval">75%</span>
    </aside>
</body>

</html>
